name: Test and deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - run: bash scripts/test.sh

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: '0'
      DEMO_SUBMITTER_PASSWORD: ${{ secrets.DEMO_SUBMITTER_PASSWORD }}
      DEMO_REVIEWER_PASSWORD: ${{ secrets.DEMO_REVIEWER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL DJANGO_SECRET_KEY DEMO_SUBMITTER_PASSWORD DEMO_REVIEWER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Add $name to the GitHub repository secrets before deployment."
              exit 1
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Migrate and prepare demo accounts
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py create_demo_users
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Build deployment
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
